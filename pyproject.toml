[project]
name = "tdp-QrCodeCOMP"
version = "1.0.0"
description = "A Component to generate QR Codes."
readme = "README.md"
keywords = [ "TouchDesigner", "TOP", "QrCode",]
license-files = [ "LICENSE",]
requires-python = ">=3.11"
dependencies = [ "qrcode[pil]>=8.2", "tdp-touchutilcollection>=0.7.3",]
[[project.authors]]
name = "Wieland Hilker"
email = "wieland@plusplus.one"

[dependency-groups]
dev = [ "monkeybrain>=0.3.0; sys_platform == 'win32'"]

[build-system]
requires = [ "setuptools>=61.0",]
build-backend = "setuptools.build_meta"

[project.urls]
Website = "https://plusplus.one"
Repository = "https://github.com/PlusPlusOneGmbH/tdp-QrCode"

[tool.uv]
environments = [ "sys_platform =='win32'", "sys_platform == 'darwin'" ]

[tool.monkeybrain]
touchdesigner-version = "2025.32460"
enforce-version = "strict"
projectfile = "Project.toe"

[tool.setuptools.package-data]
"*" = [ "*.tox",]

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.0"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = false
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]
[tool.setuptools.packages.find]
where = [ "src",]
